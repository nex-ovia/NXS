[nxs]
version = "2.0"
name = "Nexovia Standard"
description = "Delivery standard for resilient, reusable, autonomous, fast solutions"
core_statement = "Good solutions are built once, reused many times, extended without friction, and maintained without becoming a burden."

[references]
readme = "README.md"
install_guide = "INSTALL.md"
getting_started = "GETTING_STARTED.md"
skill_config = "skill.toml"
governance_config = "governance.toml"
manifest_template = "MANIFEST-SPEC.md"

[outcomes.resilience]
id = "resilience"
goal = "Project survives without original builder"
metric = "handoff_time_minutes"
target = 120
test = "Someone else runs this from instructions alone"

[outcomes.reusability]
id = "reusability"
goal = "Same logic works across multiple contexts unchanged"
metric = "contexts_deployed"
target = 5
test = "Deploy to 2+ new projects without modification"

[outcomes.ownership]
id = "ownership"
goal = "Never locked into any specific tool"
metric = "tool_swap_time_minutes"
target = 240
test = "Swap underlying tool, logic unchanged"

[outcomes.speed]
id = "speed"
goal = "Ship faster, iterate faster"
metric_setup = "setup_time_minutes"
target_setup = 5
metric_iterate = "iteration_time_minutes"
target_iterate = 10
test = "Setup in one command, iterate without rebuilding"

[[rules]]
id = "rule_1"
name = "Logic Separate from Tools"
description = "Core business logic must not know or depend on any tool"
validation = "Can core logic be tested in isolation?"

[[rules]]
id = "rule_2"
name = "Configuration Never Hardcoded"
description = "Every value that changes lives in external configuration"
validation = "Are all non-code values in external configuration?"

[[rules]]
id = "rule_3"
name = "Every Dependency Visible"
description = "Every dependency is explicit with version and reason"
validation = "Can someone list all dependencies without guessing?"

[[rules]]
id = "rule_4"
name = "Runs Anywhere, for Anyone"
description = "Setup is automated same on local, CI, production"
validation = "Does setup work with one command?"

[[gates]]
id = "gate_1"
name = "Declaration"
phase = "before_coding"
duration_minutes = 30
description = "Write down problem, scope, done criteria, dependencies"
required_fields = 9

[[gates]]
id = "gate_2"
name = "Integrity"
phase = "before_shipping"
duration_minutes = 60
description = "Verify structure matches plan, dependencies declared, setup works"
automated_checks = 9

[[gates]]
id = "gate_3"
name = "Sovereignty"
phase = "before_production"
duration_minutes = 45
description = "Confirm no lock-in, operational clarity, handoff tested"
real_world_checks = 8

[[policies]]
id = "policy_1"
name = "Outcome Traceability"
description = "Every component maps to at least one outcome"
violation = "Component has no outcome mapping"
fix = "Map to Resilience/Reusability/Ownership/Speed"

[[policies]]
id = "policy_2"
name = "Dependency Documentation"
description = "All dependencies listed with why and fallback strategy"
violation = "Missing DEPENDENCIES.md"
fix = "Create file with name, why, fallback, swap strategy"

[[policies]]
id = "policy_3"
name = "Configuration Management"
description = "Zero hardcoded secrets or values"
violation = "db_password in code"
fix = "Use environment variable"

[[policies]]
id = "policy_4"
name = "Setup Automation"
description = "One command, no manual steps"
violation = "Run these 5 manual commands"
fix = "Create setup.sh that does all 5 automatically"

[[policies]]
id = "policy_5"
name = "Error Handling"
description = "Explicit, not silent"
violation = "Silent failure try except pass"
fix = "Log error with context and remediation"

[[policies]]
id = "policy_6"
name = "Handoff Documentation"
description = "RUNBOOK.md tested with real person"
violation = "RUNBOOK.md does not exist"
fix = "Write step-by-step, test with real person"

[[policies]]
id = "policy_7"
name = "Security Baseline"
description = "No secrets in code or repository"
violation = "API key in .env committed to GitHub"
fix = "Add .env to .gitignore, commit .env.example"

[[policies]]
id = "policy_8"
name = "Testing Requirements"
description = "Core logic coverage >= 70%"
violation = "Core logic has 0 tests"
fix = "Add unit tests, achieve 70+ coverage"

[[node_types]]
id = "code"
description = "Executable software logic"
examples = ["API server", "worker", "CLI tool", "library"]
outcomes = ["resilience", "reusability", "ownership", "speed"]

[[node_types]]
id = "agent"
description = "Autonomous actor (LLM, decision engine)"
examples = ["Claude-based handler", "scheduler", "router"]
outcomes = ["reusability", "ownership", "speed"]

[[node_types]]
id = "config"
description = "External configuration (not in code)"
examples = ["environment variables", "TOML files"]
outcomes = ["ownership", "speed"]

[[node_types]]
id = "data"
description = "Persistent state (database, cache)"
examples = ["PostgreSQL table", "S3 bucket", "Redis cache"]
outcomes = ["resilience", "reusability"]

[[node_types]]
id = "decision"
description = "Business decision or policy"
examples = ["approval criteria", "routing logic"]
outcomes = ["ownership", "resilience"]

[[node_types]]
id = "business_process"
description = "Workflow involving people and systems"
examples = ["onboarding flow", "incident response"]
outcomes = ["resilience", "speed"]

[[node_types]]
id = "documentation"
description = "Runbooks, architecture, decision logs"
examples = ["RUNBOOK.md", "DECISIONS.md", "API.md"]
outcomes = ["resilience"]

[[node_types]]
id = "manual_step"
description = "Something a human does"
examples = ["code review", "testing", "approval"]
outcomes = ["resilience"]

[runtimes]
code_python = "Python 3.11 or 3.12"
code_rust = "Rust 2024 edition"
code_node = "Node.js 20 or 22"
agent_llm = "Claude, GPT, any LLM"
agent_ollama = "Local LLM via Ollama"
agent_remote = "External API or service"
execute_docker = "Docker container"
execute_lambda = "AWS Lambda"
execute_cloud_run = "Google Cloud Run"
execute_human = "Human decision"
execute_workflow = "Workflow orchestrator"
execute_cron = "Scheduled job"
storage_file = "File in repository"
storage_env = "Environment variable"

[[definition_of_done]]
box = 1
item = "Logic works in isolation (no tool dependencies)"

[[definition_of_done]]
box = 2
item = "Configuration is external and documented"

[[definition_of_done]]
box = 3
item = "All dependencies explicit with versions and reasons"

[[definition_of_done]]
box = 4
item = "Setup is automated (one command)"

[[definition_of_done]]
box = 5
item = "Runs same way locally and in production"

[[definition_of_done]]
box = 6
item = "Understandable without original author"

[[definition_of_done]]
box = 7
item = "Handoff tested with real person"

[agent_instructions]
primary_action = "Reference this schema first"
then_load = "Load only sections needed from governance.toml and skill.toml"
never_load_entire = "Do NOT load full SKILL.md or GOVERNANCE.md files"
token_savings = "Approach saves 6000+ tokens per project"

[versioning]
version = "2.0.0"
backward_compatible = true
minimum_agent = "Any agent that reads TOML"
